- insert:
  - id: hardware-buddy
    name: '@dsh-hardware-buddy/dsh-hardware-buddy'
    config:
      port: null
      vendorId: '0x303A'
      productId: null
      baudRate: 115200
      approvalTimeout: 30000
      heartbeatIntervalMs: 3000
      dangerousTools:   # P0 定稿（25 个真实工具，全小写）
        - '^bash$'
        - '^write$'
        - '^edit$'
        - '^str_replace_editor$'
      excludedTools:
        - '^MCP__danger_.*'
      celebrateThreshold: 50000
      entriesLimit: 5
      logLevel: info
